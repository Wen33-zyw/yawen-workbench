<style id="critical-layout">
  :root {
    --pdw-sidebar-width: 240px;
    --pdw-topbar-height: 72px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: var(--pdw-font-rounded);
    font-weight: 400;
    color: var(--pdw-foreground);
    background: var(--pdw-background);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--pdw-font-rounded);
    font-weight: 700;
    margin: 0;
  }

  .pdw-shell {
    min-height: 100vh;
  }

  .pdw-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--pdw-sidebar-width);
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(5, 46, 22, 0.92) 0%, rgba(21, 128, 61, 0.88) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--pdw-primary-100);
    box-shadow: var(--pdw-shadow-lg);
    z-index: 100;
  }

  [data-theme="dark"] .pdw-sidebar {
    background: linear-gradient(180deg, rgba(2, 6, 23, 0.95) 0%, rgba(6, 78, 59, 0.92) 100%);
  }

  .pdw-brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: var(--pdw-topbar-height);
    padding: 0 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .pdw-brand__name {
    font-size: var(--pdw-text-lg);
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.02em;
  }

  .pdw-brand__sub {
    font-size: var(--pdw-text-xs);
    color: var(--pdw-primary-200);
    margin-top: 4px;
    font-weight: 500;
  }

  .pdw-nav {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 0;
  }

  .pdw-nav__list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .pdw-nav__item {
    margin: 3px 10px;
  }

  .pdw-nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: var(--pdw-radius-medium);
    color: rgba(255, 255, 255, 0.78);
    text-decoration: none;
    font-size: var(--pdw-text-sm);
    font-weight: 500;
    transition: background-color var(--pdw-transition-fast), color var(--pdw-transition-fast), transform var(--pdw-transition-fast);
    outline: none;
    min-height: 44px;
  }

  .pdw-nav-link:hover,
  .pdw-nav-link:focus-visible {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    transform: translateX(2px);
  }

  .pdw-nav-link[data-active="true"] {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    box-shadow: inset 3px 0 0 var(--pdw-primary-300);
  }

  .pdw-nav-link__icon {
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .pdw-topbar {
    position: fixed;
    top: 0;
    left: var(--pdw-sidebar-width);
    right: 0;
    height: var(--pdw-topbar-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--pdw-border);
    z-index: 90;
  }

  [data-theme="dark"] .pdw-topbar {
    background: rgba(15, 23, 42, 0.72);
  }

  .pdw-page-title {
    font-size: var(--pdw-text-xl);
    font-weight: 800;
    color: var(--pdw-slate-800);
  }

  [data-theme="dark"] .pdw-page-title {
    color: var(--pdw-slate-100);
  }

  .pdw-topbar-center {
    display: flex;
    align-items: center;
    gap: 18px;
    flex: 1 1 auto;
    justify-content: center;
  }

  .pdw-clock-widget {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--pdw-border);
    border-radius: var(--pdw-radius-large);
    box-shadow: var(--pdw-shadow-sm);
  }

  [data-theme="dark"] .pdw-clock-widget {
    background: rgba(30, 41, 59, 0.6);
  }

  .pdw-clock-widget__time {
    font-size: var(--pdw-text-2xl);
    font-weight: 800;
    color: var(--pdw-primary-700);
    font-variant-numeric: tabular-nums;
  }

  [data-theme="dark"] .pdw-clock-widget__time {
    color: var(--pdw-primary-300);
  }

  .pdw-clock-widget__date {
    display: flex;
    flex-direction: column;
    font-size: var(--pdw-text-xs);
    color: var(--pdw-slate-600);
    line-height: 1.4;
  }

  [data-theme="dark"] .pdw-clock-widget__date {
    color: var(--pdw-slate-300);
  }

  .pdw-weather-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--pdw-border);
    border-radius: var(--pdw-radius-large);
    font-size: var(--pdw-text-sm);
    color: var(--pdw-slate-700);
  }

  [data-theme="dark"] .pdw-weather-widget {
    background: rgba(30, 41, 59, 0.6);
    color: var(--pdw-slate-200);
  }

  .pdw-weather-widget__icon {
    width: 22px;
    height: 22px;
    stroke: var(--pdw-amber-500);
    fill: none;
    stroke-width: 2;
  }

  .pdw-userbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pdw-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pdw-primary-400), var(--pdw-cyan-400));
    color: #ffffff;
    font-size: var(--pdw-text-xs);
    font-weight: 700;
  }

  .pdw-userbar__name {
    font-size: var(--pdw-text-sm);
    font-weight: 500;
    color: var(--pdw-slate-700);
  }

  [data-theme="dark"] .pdw-userbar__name {
    color: var(--pdw-slate-200);
  }

  .pdw-btn--icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: var(--pdw-radius-medium);
    background: rgba(255, 255, 255, 0.6);
    color: var(--pdw-slate-600);
    cursor: pointer;
    transition: background-color var(--pdw-transition-fast), color var(--pdw-transition-fast), transform var(--pdw-transition-fast);
    min-width: 44px;
    min-height: 44px;
  }

  [data-theme="dark"] .pdw-btn--icon {
    background: rgba(30, 41, 59, 0.6);
    color: var(--pdw-slate-300);
  }

  .pdw-btn--icon:hover,
  .pdw-btn--icon:focus-visible {
    background: var(--pdw-primary-100);
    color: var(--pdw-primary-700);
    transform: scale(1.08);
  }

  [data-theme="dark"] .pdw-btn--icon:hover,
  [data-theme="dark"] .pdw-btn--icon:focus-visible {
    background: rgba(6, 78, 59, 0.6);
    color: var(--pdw-primary-300);
  }

  .pdw-main {
    margin-left: var(--pdw-sidebar-width);
    padding-top: var(--pdw-topbar-height);
    min-height: 100vh;
  }

  .pdw-main__inner {
    padding: 24px;
    min-height: calc(100vh - var(--pdw-topbar-height));
  }

  .pdw-menu-toggle {
    display: none;
  }

  @media (max-width: 1023px) {
    :root {
      --pdw-topbar-height: 64px;
    }

    .pdw-menu-toggle {
      display: inline-flex;
      margin-right: 12px;
    }

    .pdw-sidebar {
      transform: translateX(-100%);
      transition: transform var(--pdw-transition-base);
    }

    .pdw-sidebar.is-open {
      transform: translateX(0);
    }

    .pdw-topbar {
      left: 0;
      padding: 0 16px;
    }

    .pdw-topbar-center {
      display: none;
    }

    .pdw-main {
      margin-left: 0;
    }

    .pdw-main__inner {
      padding: 16px;
    }
  }

  @media (max-width: 767px) {
    .pdw-page-title {
      font-size: var(--pdw-text-md);
    }

    .pdw-userbar__name {
      display: none;
    }
  }
</style>

<script>
  (function () {
    function setActiveNav() {
      var key = document.body && document.body.dataset.activeNav;
      if (!key) return;
      var link = document.querySelector('.pdw-nav-link[data-nav-key="' + key + '"]');
      if (link) {
        link.setAttribute('data-active', 'true');
      }
    }

    function initTheme() {
      var saved = localStorage.getItem('pdw-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeIcon(theme);
    }

    function updateThemeIcon(theme) {
      var icon = document.getElementById('pdw-theme-icon');
      if (!icon) return;
      if (theme === 'dark') {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />';
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />';
      }
    }

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pdw-theme', next);
      updateThemeIcon(next);
    }

    function pad(n) {
      return n < 10 ? '0' + n : n;
    }

    function updateClock() {
      var now = new Date();
      var weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var timeEl = document.getElementById('pdw-clock-time');
      var dateEl = document.getElementById('pdw-clock-date');
      var weekEl = document.getElementById('pdw-clock-week');
      if (timeEl) timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
      if (dateEl) dateEl.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日';
      if (weekEl) weekEl.textContent = weekDays[now.getDay()];
    }

    function updateWeather() {
      var el = document.getElementById('pdw-weather-text');
      if (!el) return;
      if (!navigator.geolocation) {
        el.textContent = '杭州 24°C 晴';
        return;
      }
      var cached = localStorage.getItem('pdw-weather');
      var cachedAt = localStorage.getItem('pdw-weather-at');
      var now = Date.now();
      if (cached && cachedAt && now - parseInt(cachedAt, 10) < 30 * 60 * 1000) {
        el.textContent = cached;
        return;
      }
      el.textContent = '杭州 24°C 晴';
    }

    function initMenu() {
      var toggle = document.getElementById('pdw-menu-toggle');
      var sidebar = document.getElementById('pdw-sidebar');
      if (!toggle || !sidebar) return;
      toggle.addEventListener('click', function () {
        sidebar.classList.toggle('is-open');
      });
      document.addEventListener('click', function (e) {
        if (window.innerWidth > 1023) return;
        if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
          sidebar.classList.remove('is-open');
        }
      });
    }

    function init() {
      setActiveNav();
      initTheme();
      updateClock();
      updateWeather();
      setInterval(updateClock, 1000);

      var themeBtn = document.getElementById('pdw-theme-toggle');
      if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

      initMenu();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
