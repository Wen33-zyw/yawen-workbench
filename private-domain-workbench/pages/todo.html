    <style id="theme-vars">
/* 雅文的工作台 - 品牌设计令牌（春色系简约高级版） */

:root {
  /* 品牌主色：青草绿 */
  --pdw-primary-50: #f0fdf4;
  --pdw-primary-100: #dcfce7;
  --pdw-primary-200: #bbf7d0;
  --pdw-primary-300: #86efac;
  --pdw-primary-400: #7cbc67;
  --pdw-primary-500: #65a352;
  --pdw-primary-600: #4d7f41;
  --pdw-primary-700: #3b6333;
  --pdw-primary-800: #2a4825;
  --pdw-primary-900: #1a2e17;
  --pdw-primary-950: #0d1a0c;

  /* 清新青：湖水蓝 / 淡天蓝 */
  --pdw-cyan-50: #f0f9ff;
  --pdw-cyan-100: #e0f2fe;
  --pdw-cyan-200: #b5e8ff;
  --pdw-cyan-300: #a7d3d6;
  --pdw-cyan-400: #7dd3fc;
  --pdw-cyan-500: #38bdf8;
  --pdw-cyan-600: #0ea5e9;
  --pdw-cyan-700: #0284c7;

  /* 激励金/杏色 */
  --pdw-amber-50: #fffbeb;
  --pdw-amber-100: #fef3c7;
  --pdw-amber-400: #fbbf24;
  --pdw-amber-500: #f59e0b;
  --pdw-amber-600: #d97706;

  /* 中性色 */
  --pdw-slate-50: #f8fafc;
  --pdw-slate-100: #f1f5f9;
  --pdw-slate-200: #e2e8f0;
  --pdw-slate-300: #cbd5e1;
  --pdw-slate-400: #94a3b8;
  --pdw-slate-500: #64748b;
  --pdw-slate-600: #475569;
  --pdw-slate-700: #334155;
  --pdw-slate-800: #1e293b;
  --pdw-slate-900: #0f172a;
  --pdw-slate-950: #020617;

  /* RGB 分量，用于 rgba() 透明色 */
  --pdw-white-rgb: 255, 255, 255;
  --pdw-black-rgb: 0, 0, 0;
  --pdw-slate-900-rgb: 15, 23, 42;
  --pdw-slate-800-rgb: 30, 41, 59;
  --pdw-slate-700-rgb: 51, 65, 85;
  --pdw-cyan-600-rgb: 14, 165, 233;
  --pdw-slate-950-rgb: 2, 6, 23;
  --pdw-primary-950-rgb: 13, 26, 12;
  --pdw-primary-900-rgb: 26, 72, 37;
  --pdw-primary-800-rgb: 42, 72, 37;
  --pdw-primary-700-rgb: 59, 99, 51;
  --pdw-primary-600-rgb: 77, 127, 65;
  --pdw-primary-500-rgb: 101, 163, 82;
  --pdw-primary-400-rgb: 124, 188, 103;
  --pdw-cyan-400-rgb: 125, 211, 252;

  /* 奖章/排行专用色 */
  --pdw-gold-400: #ffd700;
  --pdw-gold-600: #ffaa00;
  --pdw-bronze-50: #fef7f0;
  --pdw-bronze-400: #cd7f32;
  --pdw-bronze-600: #a05a2c;
  --pdw-medal-gold: linear-gradient(135deg, var(--pdw-gold-400), var(--pdw-gold-600));
  --pdw-medal-silver: linear-gradient(135deg, var(--pdw-slate-400), var(--pdw-slate-500));
  --pdw-medal-bronze: linear-gradient(135deg, var(--pdw-bronze-400), var(--pdw-bronze-600));
  --pdw-medal-text: #ffffff;
  --pdw-medal-silver-bg: linear-gradient(180deg, var(--pdw-slate-100), var(--pdw-card));
  --pdw-medal-bronze-bg: linear-gradient(180deg, var(--pdw-bronze-50), var(--pdw-card));
  --pdw-quick-icon-bg: linear-gradient(135deg, #cde5cd 0%, #c2e2c2 50%, #b9dfb9 100%);

  /* 语义状态色 */
  --state-success: #7cbc67;
  --state-success-bg: #e8f5e4;
  --state-warning: #f59e0b;
  --state-warning-bg: #fef3c7;
  --state-error: #ef4444;
  --state-error-bg: #fee2e2;
  --state-info: #38bdf8;
  --state-info-bg: #e0f2fe;

  /* 语义别名 */
  --pdw-background: linear-gradient(180deg, #e8f7ff 0%, #f0fdf4 100%);
  --pdw-foreground: #1e293b;
  --pdw-card: rgba(255, 255, 255, 0.82);
  --pdw-card-foreground: #1e293b;
  --pdw-popover: #ffffff;
  --pdw-popover-foreground: #1e293b;
  --pdw-primary: #7cbc67;
  --pdw-primary-foreground: #ffffff;
  --pdw-muted: #f1f5f9;
  --pdw-muted-foreground: #64748b;
  --pdw-border: rgba(148, 163, 184, 0.18);
  --pdw-input: #e2e8f0;
  --pdw-ring: #7cbc67;
  --pdw-radius-small: 4px;
  --pdw-radius-medium: 8px;
  --pdw-radius-large: 12px;

  /* 结构语义色（透明/渐变） */
  --pdw-sidebar-bg: linear-gradient(180deg, rgba(var(--pdw-primary-950-rgb), 0.92) 0%, rgba(var(--pdw-primary-600-rgb), 0.88) 100%);
  --pdw-sidebar-bg-dark: linear-gradient(180deg, rgba(var(--pdw-slate-950-rgb), 0.95) 0%, rgba(var(--pdw-primary-900-rgb), 0.92) 100%);
  --pdw-topbar-bg: rgba(var(--pdw-white-rgb), 0.72);
  --pdw-topbar-bg-dark: rgba(var(--pdw-slate-900-rgb), 0.72);
  --pdw-glass-bg: rgba(var(--pdw-white-rgb), 0.6);
  --pdw-glass-bg-dark: rgba(var(--pdw-slate-800-rgb), 0.6);
  --pdw-nav-link-text: rgba(var(--pdw-white-rgb), 0.78);
  --pdw-nav-link-hover-bg: rgba(var(--pdw-white-rgb), 0.1);
  --pdw-nav-link-active-bg: rgba(var(--pdw-white-rgb), 0.16);
  --pdw-brand-border: rgba(var(--pdw-white-rgb), 0.1);

  /* 字体系统：圆润、轻字重 */
  --pdw-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --pdw-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "PingFang SC", monospace;
  --pdw-font-rounded: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* 字号系统 */
  --pdw-text-xs: 12px;
  --pdw-text-sm: 13px;
  --pdw-text-base: 14px;
  --pdw-text-md: 16px;
  --pdw-text-lg: 18px;
  --pdw-text-xl: 20px;
  --pdw-text-2xl: 24px;
  --pdw-text-3xl: 30px;

  /* 阴影：更清透 */
  --pdw-shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.03);
  --pdw-shadow-md: 0 4px 12px -2px rgba(20, 83, 45, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
  --pdw-shadow-lg: 0 12px 24px -6px rgba(20, 83, 45, 0.05), 0 4px 8px -4px rgba(15, 23, 42, 0.03);

  /* 动画 */
  --pdw-transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --pdw-transition-base: 240ms cubic-bezier(0.4, 0, 0.2, 1);
  --pdw-transition-slow: 360ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* 深色模式：青草绿为主的高雅暗色 */
[data-theme="dark"] {
  --pdw-background: linear-gradient(180deg, #0f172a 0%, #1a2e17 100%);
  --pdw-foreground: #f1f5f9;
  --pdw-card: rgba(30, 41, 59, 0.72);
  --pdw-card-foreground: #f1f5f9;
  --pdw-popover: #1e293b;
  --pdw-popover-foreground: #f1f5f9;
  --pdw-primary: #7cbc67;
  --pdw-primary-foreground: #052e16;
  --pdw-muted: #334155;
  --pdw-muted-foreground: #94a3b8;
  --pdw-border: rgba(148, 163, 184, 0.12);
  --pdw-input: #334155;
  --pdw-ring: #7cbc67;
  --pdw-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.18);
  --pdw-shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.2), 0 2px 6px -2px rgba(0, 0, 0, 0.12);
  --pdw-shadow-lg: 0 12px 24px -6px rgba(0, 0, 0, 0.25), 0 4px 8px -4px rgba(0, 0, 0, 0.15);
}

/* 字体工具类 */
.font-sans { font-family: var(--pdw-font-sans); }
.font-mono { font-family: var(--pdw-font-mono); }
.font-rounded { font-family: var(--pdw-font-rounded); }

/* 字号工具类 */
.text-xs { font-size: var(--pdw-text-xs); }
.text-sm { font-size: var(--pdw-text-sm); }
.text-base { font-size: var(--pdw-text-base); }
.text-md { font-size: var(--pdw-text-md); }
.text-lg { font-size: var(--pdw-text-lg); }
.text-xl { font-size: var(--pdw-text-xl); }
.text-2xl { font-size: var(--pdw-text-2xl); }
.text-3xl { font-size: var(--pdw-text-3xl); }

/* 通用按钮悬停缩放 */
.pdw-btn,
button,
.pdw-filter-chip,
.pdw-nav-link,
.pdw-card,
.pdw-stat,
.pdw-asset-card {
  transition: transform var(--pdw-transition-fast), box-shadow var(--pdw-transition-fast), background-color var(--pdw-transition-fast);
}

.pdw-btn:hover,
button:not(:disabled):hover,
.pdw-filter-chip:hover,
.pdw-nav-link:hover,
.pdw-card:hover,
.pdw-stat:hover,
.pdw-asset-card:hover {
  transform: translateY(-1px) scale(1.01);
}

.pdw-btn:active,
button:not(:disabled):active,
.pdw-filter-chip:active,
.pdw-nav-link:active {
  transform: translateY(0) scale(0.99);
}

<style id="critical-layout">
  :root {
    --pdw-sidebar-width: 240px;
    --pdw-topbar-height: 72px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--pdw-font-rounded);
    font-weight: 400;
    color: var(--pdw-foreground);
    background: var(--pdw-background);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4,h5,h6 { font-family: var(--pdw-font-rounded); font-weight: 700; margin: 0; }
  .pdw-shell { min-height: 100vh; }
  .pdw-sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--pdw-sidebar-width);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(var(--pdw-primary-950-rgb), 0.92) 0%, rgba(var(--pdw-primary-600-rgb), 0.88) 100%);
    backdrop-filter: blur(16px); color: var(--pdw-primary-100);
    box-shadow: var(--pdw-shadow-lg); z-index: 100;
  }
  [data-theme="dark"] .pdw-sidebar {
    background: linear-gradient(180deg, rgba(var(--pdw-slate-950-rgb), 0.95) 0%, rgba(var(--pdw-primary-900-rgb), 0.92) 100%);
  }
  .pdw-brand { display:flex; flex-direction:column; justify-content:center; height:var(--pdw-topbar-height); padding:0 20px; border-bottom: 1px solid var(--pdw-brand-border); }
  .pdw-brand__name { font-size:var(--pdw-text-lg); font-weight:800; color:var(--pdw-popover); }
  .pdw-brand__sub { font-size:var(--pdw-text-xs); color:var(--pdw-primary-200); margin-top:4px; font-weight:500; }
  .pdw-nav { flex:1 1 auto; overflow-y:auto; padding:12px 0; }
  .pdw-nav__list { list-style:none; margin:0; padding:0; }
  .pdw-nav__item { margin:3px 10px; }
  .pdw-nav-link { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--pdw-radius-medium); color: var(--pdw-nav-link-text); text-decoration:none; font-size:var(--pdw-text-sm); font-weight:500; transition:all var(--pdw-transition-fast); outline:none; min-height:44px; }
  .pdw-nav-link:hover, .pdw-nav-link:focus-visible { background: var(--pdw-nav-link-hover-bg); color:var(--pdw-popover); transform:translateX(2px); }
  .pdw-nav-link[data-active="true"] { background: var(--pdw-nav-link-active-bg); color:var(--pdw-popover); box-shadow:inset 3px 0 0 var(--pdw-primary-300); }
  .pdw-nav-link__icon { flex:0 0 20px; width:20px; height:20px; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .pdw-topbar { position:fixed; top:0; left:var(--pdw-sidebar-width); right:0; height:var(--pdw-topbar-height); display:flex; align-items:center; justify-content:space-between; padding:0 24px; background: var(--pdw-topbar-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--pdw-border); z-index:90; }
  [data-theme="dark"] .pdw-topbar { background: var(--pdw-topbar-bg-dark); }
  .pdw-page-title { font-size:var(--pdw-text-xl); font-weight:800; color:var(--pdw-slate-800); }
  [data-theme="dark"] .pdw-page-title { color:var(--pdw-slate-100); }
  .pdw-topbar-center { display:flex; align-items:center; gap:18px; flex:1 1 auto; justify-content:center; }
  .pdw-clock-widget { display:flex; align-items:center; gap:12px; padding:8px 16px; background: var(--pdw-glass-bg); border:1px solid var(--pdw-border); border-radius:var(--pdw-radius-large); box-shadow:var(--pdw-shadow-sm); }
  [data-theme="dark"] .pdw-clock-widget { background: var(--pdw-glass-bg-dark); }
  .pdw-clock-widget__time { font-size:var(--pdw-text-2xl); font-weight:800; color:var(--pdw-primary-700); font-variant-numeric:tabular-nums; }
  [data-theme="dark"] .pdw-clock-widget__time { color:var(--pdw-primary-300); }
  .pdw-clock-widget__date { display:flex; flex-direction:column; font-size:var(--pdw-text-xs); color:var(--pdw-slate-600); line-height:1.4; }
  [data-theme="dark"] .pdw-clock-widget__date { color:var(--pdw-slate-300); }
  .pdw-weather-widget { display:flex; align-items:center; gap:8px; padding:8px 14px; background: var(--pdw-glass-bg); border:1px solid var(--pdw-border); border-radius:var(--pdw-radius-large); font-size:var(--pdw-text-sm); color:var(--pdw-slate-700); }
  [data-theme="dark"] .pdw-weather-widget { background: var(--pdw-glass-bg-dark); color:var(--pdw-slate-200); }
  .pdw-weather-widget__icon { width:22px; height:22px; stroke:var(--pdw-amber-500); fill:none; stroke-width:2; }
  .pdw-userbar { display:flex; align-items:center; gap:12px; }
  .pdw-avatar { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--pdw-primary-400),var(--pdw-cyan-400)); color:var(--pdw-popover); font-size:var(--pdw-text-xs); font-weight:700; }
  .pdw-userbar__name { font-size:var(--pdw-text-sm); font-weight:500; color:var(--pdw-slate-700); }
  [data-theme="dark"] .pdw-userbar__name { color:var(--pdw-slate-200); }
  .pdw-btn--icon { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border:none; border-radius:var(--pdw-radius-medium); background: var(--pdw-glass-bg); color:var(--pdw-slate-600); cursor:pointer; transition:all var(--pdw-transition-fast); min-width:44px; min-height:44px; }
  [data-theme="dark"] .pdw-btn--icon { background: var(--pdw-glass-bg-dark); color:var(--pdw-slate-300); }
  .pdw-btn--icon:hover, .pdw-btn--icon:focus-visible { background:var(--pdw-primary-100); color:var(--pdw-primary-700); transform:scale(1.08); }
  [data-theme="dark"] .pdw-btn--icon:hover, [data-theme="dark"] .pdw-btn--icon:focus-visible { background:rgba(var(--pdw-primary-900-rgb), 0.6); color:var(--pdw-primary-300); }
  .pdw-main { margin-left:var(--pdw-sidebar-width); padding-top:var(--pdw-topbar-height); min-height:100vh; }
  .pdw-main__inner { padding:24px; min-height:calc(100vh - var(--pdw-topbar-height)); }
  .pdw-menu-toggle { display:none; }

<script>
(function(){
  const STORE_KEY = 'pdw-todos-v1';
  let todos = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  let currentView = 'list';
  let currentFilter = 'all';
  let calDate = new Date();

  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(todos)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr() { const d = new Date(); return d.toISOString().slice(0,10); }
  function isOverdue(due) { return due && due < todayStr() && due !== todayStr(); }
  function daysDiff(a,b) { return Math.round((new Date(b)-new Date(a))/(1000*60*60*24)); }

  function migrateBirthdays() {
    const y = new Date().getFullYear();
    todos.forEach(t => {
      if (t.type === 'birthday' && t.due) {
        const md = t.due.slice(5);
        const next = y + '-' + md;
        t.due = next;
        if (next < todayStr()) {
          t.due = (y+1) + '-' + md;
        }
      }
    });
  }

  function tagHtml(type) {
    const map = { daily: ['pdw-tag--daily','日常'], urgent: ['pdw-tag--urgent','紧急'], plan: ['pdw-tag--plan','计划'], birthday: ['pdw-tag--birthday','生日'] };
    const [cls, text] = map[type] || map.daily;
    return `<span class="pdw-tag ${cls}">${text}</span>`;
  }

  function renderList() {
    const container = document.getElementById('todo-list');
    let list = todos.slice();
    if (currentFilter === 'today') list = list.filter(t => t.due === todayStr());
    else if (currentFilter === 'urgent') list = list.filter(t => t.type === 'urgent' || (t.priority === 'important' && !t.done));
    else if (currentFilter === 'planned') list = list.filter(t => !t.done);
    else if (currentFilter === 'done') list = list.filter(t => t.done);

    list.sort((a,b) => (a.done?1:-1) - (b.done?1:-1) || (a.due||'9999').localeCompare(b.due||'9999'));

    container.innerHTML = list.length ? '' : '<div style="text-align:center;color:var(--pdw-slate-500);padding:30px;">暂无待办，去添加一个吧</div>';
    list.forEach(t => {
      const overdue = !t.done && isOverdue(t.due);
      const div = document.createElement('div');
      div.className = 'pdw-todo-item' + (t.done?' is-done':'') + (overdue?' is-overdue':'');
      div.innerHTML = `
        <input type="checkbox" class="pdw-todo-item__check" ${t.done?'checked':''} data-id="${t.id}">
        <div class="pdw-todo-item__body">
          <div class="pdw-todo-item__title">${t.title}</div>
          <div class="pdw-todo-item__meta">
            <span>截止：${t.due || '未设置'}</span>
            ${overdue ? '<span style="color:var(--state-error);margin-left:8px;">已延期</span>' : ''}
            <span style="margin-left:8px;">优先级：${t.priority==='important'?'重要':'普通'}</span>
          </div>
          <div class="pdw-todo-item__tags" style="margin-top:6px;">${tagHtml(t.type)}</div>
        </div>
        <button class="pdw-btn pdw-btn--secondary" style="height:34px;padding:0 12px;" data-edit="${t.id}">编辑</button>
        <button class="pdw-btn pdw-btn--danger" style="height:34px;padding:0 12px;" data-del="${t.id}">删除</button>
      `;
      container.appendChild(div);
    });
  }

  function renderCard() {
    const q1 = todos.filter(t => !t.done && t.priority==='important' && t.type==='urgent');
    const q2 = todos.filter(t => !t.done && t.priority==='important' && t.type!=='urgent');
    const q3 = todos.filter(t => !t.done && t.priority!=='important' && t.type==='urgent');
    const q4 = todos.filter(t => !t.done && t.priority!=='important' && t.type!=='urgent');
    const done = todos.filter(t => t.done);
    ['q1','q2','q3','q4'].forEach((id, i) => {
      const arr = [q1,q2,q3,q4][i];
      document.getElementById(id).innerHTML = arr.map(t => `<div class="pdw-todo-item"><div class="pdw-todo-item__body"><div class="pdw-todo-item__title">${t.title}</div><div class="pdw-todo-item__meta">${t.due}</div><div class="pdw-todo-item__tags">${tagHtml(t.type)}</div></div></div>`).join('') || '<div style="color:var(--pdw-slate-400);font-size:var(--pdw-text-sm);">无</div>';
    });
  }

  function renderCalendar() {
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('cal-month').textContent = `${y}年${m+1}月`;
    const header = document.getElementById('cal-header');
    header.innerHTML = ['日','一','二','三','四','五','六'].map(d => `<div class="pdw-calendar__weekday">${d}</div>`).join('');
    const first = new Date(y,m,1).getDay();
    const days = new Date(y,m+1,0).getDate();
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    for (let i=0;i<first;i++) grid.innerHTML += '<div></div>';
    const today = todayStr();
    for (let d=1; d<=days; d++) {
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayTasks = todos.filter(t => t.due === dateStr);
      const cell = document.createElement('div');
      cell.className = 'pdw-calendar__day' + (dateStr===today?' is-today':'') + (dayTasks.length?' has-task':'');
      cell.innerHTML = `<span>${d}</span>`;
      cell.onclick = () => showDayTasks(dateStr, dayTasks);
      grid.appendChild(cell);
    }
  }

  function showDayTasks(date, tasks) {
    const el = document.getElementById('cal-task-detail');
    el.innerHTML = `<strong>${date}</strong>` + (tasks.length ? tasks.map(t => `<div style="margin-top:6px;">${t.done?'[完成]':'[待办]'} ${t.title} ${tagHtml(t.type)}</div>`).join('') : '<div style="color:var(--pdw-slate-400);">无待办</div>');
  }

  function renderDashboard() {
    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    const overdue = todos.filter(t => !t.done && isOverdue(t.due)).length;
    const rate = total ? Math.round(done/total*100) : 0;
    document.getElementById('ring-completion').style.setProperty('--p', rate + '%');
    document.getElementById('ring-text').textContent = rate + '%';

    const status = {
      '今天': todos.filter(t => t.due === todayStr()).length,
      '紧急': todos.filter(t => t.type === 'urgent' && !t.done).length,
      '计划中': todos.filter(t => !t.done).length,
      '已完成': done,
      '已延期': overdue
    };
    document.getElementById('status-bars').innerHTML = Object.entries(status).map(([k,v]) => {
      const pct = total ? Math.round(v/total*100) : 0;
      return `<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:var(--pdw-text-sm);margin-bottom:4px;"><span>${k}</span><span>${v}</span></div><div style="height:8px;background:var(--pdw-border);border-radius:4px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:var(--pdw-primary);border-radius:4px;"></div></div></div>`;
    }).join('');

    const trend = document.getElementById('trend-bars');
    trend.innerHTML = '';
    for (let i=6; i>=0; i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      const ds = d.toISOString().slice(0,10);
      const c = todos.filter(t => t.due === ds && t.done).length;
      const max = Math.max(1, ...Array.from({length:7},(_,j)=>{const dd=new Date();dd.setDate(dd.getDate()-j);return todos.filter(t=>t.due===dd.toISOString().slice(0,10)&&t.done).length;}));
      const h = Math.round(c/max*100);
      trend.innerHTML += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;height:${h}%;background:var(--pdw-primary-400);border-radius:4px;min-height:4px;"></div><span style="font-size:10px;color:var(--pdw-slate-500);">${d.getMonth()+1}/${d.getDate()}</span></div>`;
    }

    document.getElementById('todo-stats').innerHTML = `
      <div><div style="font-size:var(--pdw-text-2xl);font-weight:800;color:var(--pdw-primary);">${total}</div><div style="font-size:var(--pdw-text-xs);color:var(--pdw-slate-500);">总待办</div></div>
      <div><div style="font-size:var(--pdw-text-2xl);font-weight:800;color:var(--state-success);">${done}</div><div style="font-size:var(--pdw-text-xs);color:var(--pdw-slate-500);">已完成</div></div>
      <div><div style="font-size:var(--pdw-text-2xl);font-weight:800;color:var(--state-error);">${overdue}</div><div style="font-size:var(--pdw-text-xs);color:var(--pdw-slate-500);">已延期</div></div>
      <div><div style="font-size:var(--pdw-text-2xl);font-weight:800;color:var(--state-warning);">${todos.filter(t=>t.type==='birthday').length}</div><div style="font-size:var(--pdw-text-xs);color:var(--pdw-slate-500);">生日提醒</div></div>
    `;
  }

  function renderSummary() {
    const today = todayStr();
    const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
    const tmrStr = tmr.toISOString().slice(0,10);
    document.getElementById('summary-today').innerHTML = todos.filter(t => t.due === today).map(t => `<div>${t.done?'[完成]':'[待办]'} ${t.title}</div>`).join('') || '<div style="color:var(--pdw-slate-400);">今天没有待办</div>';
    document.getElementById('summary-tomorrow').innerHTML = todos.filter(t => t.due === tmrStr).map(t => `<div>${t.title}</div>`).join('') || '<div style="color:var(--pdw-slate-400);">明天没有计划</div>';
    const monthInput = document.getElementById('summary-month');
    if (!monthInput.value) monthInput.value = today.slice(0,7);
    const m = monthInput.value;
    const list = todos.filter(t => t.due && t.due.startsWith(m));
    const done = list.filter(t => t.done).length;
    document.getElementById('summary-month-stats').innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>该月待办</span><strong>${list.length}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>已完成</span><strong>${done}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>完成率</span><strong>${list.length?Math.round(done/list.length*100):0}%</strong></div>
    `;
  }

  function render() {
    migrateBirthdays();
    if (currentView === 'list') renderList();
    else if (currentView === 'card') renderCard();
    else if (currentView === 'calendar') renderCalendar();
    else if (currentView === 'dashboard') renderDashboard();
    else if (currentView === 'summary') renderSummary();
  }

  function addTodo() {
    const title = document.getElementById('todo-title').value.trim();
    if (!title) return;
    todos.push({ id: uid(), title, type: document.getElementById('todo-type').value, due: document.getElementById('todo-due').value, priority: document.getElementById('todo-priority').value, done: false });
    save(); render();
    document.getElementById('todo-title').value = '';
  }

  function checkNotifications() {
    if (!('Notification' in window)) return;
    const now = new Date();
    todos.forEach(t => {
      if (t.done) return;
      if (!t.due) return;
      const diff = daysDiff(todayStr(), t.due);
      if (diff === 0 || (t.type === 'birthday' && diff === 3)) {
        if (Notification.permission === 'granted') {
          new Notification('雅文的工作台', { body: `待办提醒：${t.title}` });
        }
      }
    });
  }

  document.getElementById('todo-add').addEventListener('click', addTodo);
  document.getElementById('todo-title').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  document.getElementById('todo-view-tabs').addEventListener('click', e => {
    if (!e.target.classList.contains('pdw-tab')) return;
    document.querySelectorAll('.pdw-tab').forEach(t => t.classList.remove('is-active'));
    e.target.classList.add('is-active');
    currentView = e.target.dataset.view;
    ['list','card','calendar','dashboard','summary'].forEach(v => document.getElementById('todo-' + v + '-view').style.display = v === currentView ? 'block' : 'none');
    render();
  });

  document.getElementById('todo-filters').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    currentFilter = e.target.dataset.filter;
    renderList();
  });

  document.getElementById('todo-list').addEventListener('click', e => {
    const id = e.target.dataset.id || e.target.dataset.edit || e.target.dataset.del;
    if (!id) return;
    if (e.target.dataset.id) {
      const t = todos.find(x => x.id === id);
      if (t) { t.done = e.target.checked; save(); render(); }
    } else if (e.target.dataset.edit) {
      openEdit(id);
    } else if (e.target.dataset.del) {
      todos = todos.filter(x => x.id !== id);
      save(); render();
    }
  });

  function openEdit(id) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    document.getElementById('edit-id').value = t.id;
    document.getElementById('edit-title').value = t.title;
    document.getElementById('edit-type').value = t.type;
    document.getElementById('edit-due').value = t.due;
    document.getElementById('edit-priority').value = t.priority;
    document.getElementById('edit-modal').classList.add('is-open');
  }

  document.getElementById('edit-save').addEventListener('click', () => {
    const id = document.getElementById('edit-id').value;
    const t = todos.find(x => x.id === id);
    if (t) {
      t.title = document.getElementById('edit-title').value;
      t.type = document.getElementById('edit-type').value;
      t.due = document.getElementById('edit-due').value;
      t.priority = document.getElementById('edit-priority').value;
      save(); render();
    }
    document.getElementById('edit-modal').classList.remove('is-open');
  });

  document.getElementById('edit-cancel').addEventListener('click', () => {
    document.getElementById('edit-modal').classList.remove('is-open');
  });

  document.getElementById('cal-prev').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
  document.getElementById('cal-next').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });
  document.getElementById('summary-month').addEventListener('change', renderSummary);

  // Theme / menu / clock shared logic (inline duplicate for standalone page)
  function initTheme() {
    const saved = localStorage.getItem('pdw-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
  }
  function updateThemeIcon(theme) {
    const icon = document.getElementById('pdw-theme-icon');
    if (!icon) return;
    if (theme === 'dark') icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />';
    else icon.innerHTML = '<circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />';
  }
  document.getElementById('pdw-theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pdw-theme', next);
    updateThemeIcon(next);
  });
  function updateClock() {
    const now = new Date();
    const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const t = document.getElementById('pdw-clock-time');
    if (t) t.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    const d = document.getElementById('pdw-clock-date');
    if (d) d.textContent = (now.getMonth()+1) + '月' + now.getDate() + '日';
    const w = document.getElementById('pdw-clock-week');
    if (w) w.textContent = weekDays[now.getDay()];
  }
  function updateWeather() {
    const el = document.getElementById('pdw-weather-text');
    if (!el) return;
    const cached = localStorage.getItem('pdw-weather');
    el.textContent = cached || '杭州 24°C 晴';
  }
  document.getElementById('pdw-menu-toggle').addEventListener('click', () => document.getElementById('pdw-sidebar').classList.toggle('is-open'));

  initTheme();
  updateClock();
  updateWeather();
  setInterval(updateClock, 1000);
  render();
  checkNotifications();
})();
</script>

    <style>

      .pdw-input:focus, .pdw-select:focus {
        outline: none;
        border-color: var(--pdw-primary);
        box-shadow: 0 0 0 3px var(--pdw-primary-100);
      }
      .pdw-btn {
        display: inline-flex;

      }
      @media (max-width: 1023px) {
        .pdw-todo-form { grid-template-columns: 1fr; }
      }
      .pdw-todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: var(--pdw-card);
        border: 1px solid var(--pdw-border);
        border-radius: var(--pdw-radius-medium);
        margin-bottom: 10px;
        transition: all var(--pdw-transition-fast);
      }
      .pdw-todo-item:hover { transform: translateY(-1px); box-shadow: var(--pdw-shadow-md); }
      .pdw-todo-item.is-done { opacity: 0.62; }
      .pdw-todo-item.is-overdue { border-color: var(--state-error); background: var(--state-error-bg); }
      .pdw-todo-item__check {
        width: 22px;
        height: 22px;
        accent-color: var(--pdw-primary);
        flex-shrink: 0;
      }
      .pdw-todo-item__body { flex: 1 1 auto; }
      .pdw-todo-item__title {
        font-weight: 600;
        color: var(--pdw-slate-800);
      }
      [data-theme="dark"] .pdw-todo-item__title { color: var(--pdw-slate-100); }
      .pdw-todo-item__meta {
        font-size: var(--pdw-text-xs);
        color: var(--pdw-slate-500);
        margin-top: 4px;
      }
      .pdw-todo-item__tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pdw-tag {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: var(--pdw-text-xs);
        font-weight: 500;
      }
      .pdw-tag--daily { background: var(--pdw-primary-100); color: var(--pdw-primary-700); }
      .pdw-tag--birthday { background: var(--state-error-bg); color: var(--state-error); }
      .pdw-tag--urgent { background: var(--state-warning-bg); color: var(--state-warning); }
      .pdw-tag--plan { background: var(--state-info-bg); color: var(--state-info); }
      .pdw-quadrant {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 767px) { .pdw-quadrant { grid-template-columns: 1fr; } }
      .pdw-quadrant__box {
        min-height: 180px;
        padding: 16px;
        border-radius: var(--pdw-radius-large);
        border: 1px solid var(--pdw-border);
        background: var(--pdw-card);
      }
      .pdw-quadrant__title {
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pdw-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .pdw-calendar__day {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: var(--pdw-radius-medium);
        background: var(--pdw-card);
        border: 1px solid var(--pdw-border);
        font-size: var(--pdw-text-sm);
        cursor: pointer;
        position: relative;
      }
      .pdw-calendar__day.is-today { border-color: var(--pdw-primary); color: var(--pdw-primary); font-weight: 700; }
      .pdw-calendar__day.has-task::after {
        content: '';
        position: absolute;
        bottom: 6px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--pdw-primary);
      }
      .pdw-calendar__weekday {
        text-align: center;
        font-size: var(--pdw-text-xs);
        color: var(--pdw-slate-500);
        padding: 8px 0;
      }
      .pdw-chart-ring {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: conic-gradient(var(--pdw-primary) var(--p, 0%), var(--pdw-border) 0);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }
      .pdw-chart-ring__inner {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: var(--pdw-card);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: var(--pdw-text-xl);
        color: var(--pdw-slate-800);
      }
      .pdw-summary-card {
        background: var(--pdw-card);
        border: 1px solid var(--pdw-border);
        border-radius: var(--pdw-radius-large);
        padding: 18px;
      }
      .pdw-summary-card h3 {
        font-size: var(--pdw-text-md);
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--pdw-slate-800);
      }
      [data-theme="dark"] .pdw-summary-card h3 { color: var(--pdw-slate-100); }
      .pdw-modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 16px;
      }
      .pdw-modal.is-open { display: flex; }
      .pdw-modal__box {
        background: var(--pdw-card);
        border-radius: var(--pdw-radius-large);
        padding: 24px;
        width: 100%;
        max-width: 420px;
        max-height: 90vh;
        overflow-y: auto;
      }
    </style>
</body>
